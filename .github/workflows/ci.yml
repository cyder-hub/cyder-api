name: CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.detect.outputs.run_backend }}
      run_frontend: ${{ steps.detect.outputs.run_frontend }}
      run_transform: ${{ steps.detect.outputs.run_transform }}
      run_docker_smoke: ${{ steps.detect.outputs.run_docker_smoke }}
      run_migration_smoke: ${{ steps.detect.outputs.run_migration_smoke }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          run_backend=false
          run_frontend=false
          run_transform=false
          run_docker_smoke=false
          run_migration_smoke=false
          changed_files="$(mktemp)"
          : > "$changed_files"

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$changed_files"
            else
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
            fi

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              case "$file" in
                Cargo.toml|Cargo.lock|server/*)
                  run_backend=true
                  ;;
              esac

              case "$file" in
                docs/protocol-compatibility.yaml|docs/protocol-compatibility.md)
                  run_backend=true
                  ;;
              esac

              case "$file" in
                Cargo.toml|Cargo.lock|server/Cargo.toml|server/benches/transform_benchmark.rs|server/src/bin/transform_quality_gate.rs|server/src/service/transform/*|server/src/schema/enum_def.rs|server/src/cost/*|server/src/utils/mod.rs|server/src/utils/sse.rs|server/src/utils/usage.rs)
                  run_transform=true
                  ;;
              esac

              case "$file" in
                front/*)
                  run_frontend=true
                  ;;
              esac

              case "$file" in
                .github/workflows/ci.yml)
                  run_backend=true
                  run_frontend=true
                  run_transform=true
                  ;;
              esac

              case "$file" in
                .github/actions/transform-quality-gate/*)
                  run_transform=true
                  ;;
              esac

              case "$file" in
                Dockerfile|.dockerignore|docker-entrypoint|Cargo.toml|Cargo.lock|server/Cargo.toml|front/package.json|front/package-lock.json)
                  run_docker_smoke=true
                  ;;
              esac

              case "$file" in
                Cargo.toml|Cargo.lock|server/Cargo.toml|server/src/database/mod.rs|server/src/database/migration_smoke_tests.rs|server/migrations/**|.github/workflows/ci.yml)
                  run_migration_smoke=true
                  ;;
              esac
            done < "$changed_files"

            if [[ "$EVENT_NAME" == "push" ]]; then
              # Master Image builds the real commit image in parallel with CI.
              # Repeating the same Docker build here only doubles work.
              run_docker_smoke=false
            fi
          else
            run_backend=true
            run_frontend=true
            run_transform=true
            run_docker_smoke=true
            run_migration_smoke=true
          fi

          {
            echo "run_backend=$run_backend"
            echo "run_frontend=$run_frontend"
            echo "run_transform=$run_transform"
            echo "run_docker_smoke=$run_docker_smoke"
            echo "run_migration_smoke=$run_migration_smoke"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Change Detection"
            echo ""
            echo "- run_backend: $run_backend"
            echo "- run_frontend: $run_frontend"
            echo "- run_transform: $run_transform"
            echo "- run_docker_smoke: $run_docker_smoke"
            echo "- run_migration_smoke: $run_migration_smoke"
            if [[ -s "$changed_files" ]]; then
              echo ""
              echo "Changed files:"
              sed 's/^/- /' "$changed_files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

      - name: Parse workflow and action YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "ok #{f}" }' .github/workflows/*.yml .github/actions/**/*.yml

  transform-quality-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_transform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run transform quality gate
        uses: ./.github/actions/transform-quality-gate

  backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Resolve Rust cache key
        id: rust-cache
        shell: bash
        run: echo "version=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-cargo-backend-v4-${{ steps.rust-cache.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-backend-v4-${{ steps.rust-cache.outputs.version }}-

      - name: Prepare backend test configuration
        shell: bash
        run: |
          set -euo pipefail

          ci_data_dir="$RUNNER_TEMP/cyder-backend-data"
          ci_config_dir="$ci_data_dir/config"
          ci_encryption_key="$(openssl rand -hex 32)"

          umask 077
          mkdir -p "$ci_config_dir"
          printf 'secret_encryption:\n  encryption_key: "%s"\n' \
            "$ci_encryption_key" > "$ci_config_dir/config.yaml"
          echo "CYDER_DATA_DIR=$ci_data_dir" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run log lint
        shell: bash
        run: |
          CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/server" \
            rustc --edition=2024 server/src/bin/log_lint.rs -o "$RUNNER_TEMP/log_lint"
          "$RUNNER_TEMP/log_lint"

      - name: Check protocol compatibility matrix
        run: cargo run --locked -p cyder-api --bin compatibility_matrix -- --check

      - name: Run backend tests
        run: cargo test --locked -p cyder-api

  migration-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_migration_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cyder_r1_migration_smoke
          POSTGRES_USER: cyder
          POSTGRES_PASSWORD: cyder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyder -d cyder_r1_migration_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Resolve Rust cache key
        id: rust-cache
        shell: bash
        run: echo "version=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-cargo-migration-smoke-v1-${{ steps.rust-cache.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-migration-smoke-v1-${{ steps.rust-cache.outputs.version }}-
            ${{ runner.os }}-cargo-backend-v4-${{ steps.rust-cache.outputs.version }}-

      - name: Run SQLite migration smoke
        run: cargo test --locked -p cyder-api migration_smoke_tests::sqlite_clean_upgrade_chain_from_empty -- --nocapture

      - name: Run PostgreSQL migration smoke
        env:
          CYDER_R1_POSTGRES_MIGRATION_SMOKE_URL: postgres://cyder:cyder@127.0.0.1:5432/cyder_r1_migration_smoke
        run: cargo test --locked -p cyder-api migration_smoke_tests::postgres_clean_upgrade_chain_from_empty -- --ignored --nocapture

  frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check frontend i18n
        run: npm run i18n:check

      - name: Build frontend
        run: npm run build

  docker-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_docker_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cyder-api:ci-smoke
          cache-from: |
            type=gha,scope=docker-smoke-${{ github.event.pull_request.number || github.ref_name }},version=2
            type=gha,scope=master-image,version=2
          cache-to: type=gha,scope=docker-smoke-${{ github.event.pull_request.number || github.ref_name }},mode=max,version=2
