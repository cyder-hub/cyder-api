# Base configuration sample.
#
# Docker and packaged deployments use CYDER_DATA_DIR=/data/cyder by default.
# Runtime load priority is:
# program defaults < generated config.default.yaml < base config.yaml <
# allowlisted CYDER_* environment variables.
#
# config.default.yaml is generated on first startup to persist random secrets
# and path-aware defaults. It is runtime state, not a tracked sample to edit.
#
# The only environment variables that override final config fields are
# CYDER_HOST, CYDER_PORT, CYDER_BASE_PATH, CYDER_LOG_LEVEL, CYDER_TIMEZONE, and
# CYDER_MANAGER_AUTH_BROWSER_ORIGIN.
# Use YAML for secrets, database, Redis/cache, runtime state, proxy, and
# governance settings. Configuration changes take effect after a
# server restart.
# Unknown top-level and nested YAML fields are ignored during 1.0 development,
# while invalid values for recognized fields still prevent startup.
#
# Local development is zero-config through just dev. Generated files live under
# .cyder/dev, which is git-ignored. Older config files can be reused while the
# current sample remains the source of truth for recognized fields.
host: 0.0.0.0
port: 8000
base_path: /ai
# Independent Manager JWT root secret, at least 32 bytes. Replacing it is a
# hard cutover that invalidates every Manager session but not Proxy API keys.
# Previous-secret overlap/rotation is intentionally unsupported.
jwt_secret: uCK6g1EBERjj2U7FT8sGlMFFzL2M3ufW
manager_auth:
  # Exact browser origin for Manager Auth cookie endpoints. Non-loopback origins
  # must use HTTPS. When omitted, browser auth is limited to loopback peer +
  # loopback Origin development requests.
  browser_origin: null
db_url: /data/cyder/db/cyder.sqlite
# db_url: postgres://user:pass@host:port/schema_name
# Supported database URL forms are SQLite paths and PostgreSQL URLs.
db_pool_size: 5
database_io:
  # Number of callers allowed to wait after all immediately available database
  # execution capacity is occupied. Set to 0 to reject instead of queueing.
  max_waiters: 64
  queue_wait_timeout_seconds: 1
  operation_deadline_seconds: 30
  # SQLite lock waiting is bounded independently and must not exceed the
  # operation deadline. PostgreSQL does not use this setting.
  sqlite_busy_timeout_seconds: 5
secret_encryption:
  # one_time stores only the downstream API key authentication hash.
  # recoverable additionally stores downstream ciphertext and permits explicit reveal.
  # Provider credentials are always encrypted and revealable in both modes.
  downstream_mode: one_time
  # Required in every mode. Generate an independent value, for example with
  # `openssl rand -hex 32`, and replace null in config.yaml before startup.
  # The server deliberately refuses to start while this remains null.
  # Keys use exactly 64 hexadecimal characters (32 bytes), without a prefix.
  encryption_key: null
  # During rotation, set this to the old key and encryption_key to the new key.
  # Startup rotates downstream and Provider ciphertext in one transaction;
  # any invalid Provider credential rolls everything back and refuses startup.
  # Remove this field after one successful startup.
  previous_encryption_key: null
redis:
  url: "redis://127.0.0.1:6379/"
  pool_size: 10
  key_prefix: "cyder:"
client_identity:
  # Empty by default: forwarding headers are ignored and the TCP peer is used.
  # Add only canonical CIDRs of reverse proxies that sanitize inbound headers.
  # Single hosts must be written as /32 or /128.
  trusted_proxy_cidrs: []
  # Maximum accepted Forwarded/X-Forwarded-For chain length; valid range 1..=32.
  max_forwarded_hops: 8
id:
  # Reserved Snowflake worker id. Pre-1.0 supports one running server instance.
  worker_id: 1
# proxy: http://127.0.0.1:1080
outbound_http:
  connect_timeout_seconds: 10
  auxiliary_total_timeout_seconds: 60
proxy_request:
  timeouts:
    request_send_seconds: 7200
    first_byte_seconds: 7200
    response_idle_seconds: 7200
    total_seconds: 7200
  # Provider error bodies exposed to the current caller are capped and marked as truncated.
  upstream_error_body_limit_bytes: 65536
  # Complete non-stream responses accept identity/gzip and are counted in raw bytes and decoded bytes.
  non_stream_response:
    raw_body_limit_bytes: 33554432
    decoded_body_limit_bytes: 67108864
  # SSE responses must use identity encoding. Limits count UTF-8 bytes retained by the parser and blank-line frames.
  sse_response:
    line_limit_bytes: 4194304
    event_limit_bytes: 8388608
    buffer_limit_bytes: 16777216
    frame_count_limit: 1000000
# cache:
#   backend: memory # memory or redis
#   ttl: 3600 # 1 hour
#   negative_ttl: 60 # 1 minute
#   redis:
#     key_prefix: "cache:"
