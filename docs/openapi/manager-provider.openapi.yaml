openapi: 3.1.0
info:
  title: Cyder Manager Logical Provider Living Contract
  version: 1.0.0-pre.5
  description: Logical Provider, zero-to-many Upstream Source aggregate, deterministic Source selection, and Provider-owned opaque credential lifecycle contract for the single-manager gateway.
servers:
  - url: /
security:
  - managerAccessToken: []
x-cyder-default-cache-control: no-store
x-cyder-web-security-client-identity-contract: ../web-security-client-identity.md
x-cyder-secret-governance-reauth-operation-ids: [revealProviderKeySecret]
x-cyder-provider-mutation-operation-ids-without-totp: [createProviderKey, updateProviderKeyMetadata, replaceProviderKeySecret, deleteProviderKey]
paths:
  /ai/manager/api/model:
    post:
      operationId: createModel
      description: Creates a Provider-scoped Model and optionally commits its complete Source Config in the same transaction. Omitting source_config persists INHERIT_ALL with no bindings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelCreate" }
      responses:
        "200": { $ref: "#/components/responses/Model" }
        "422": { $ref: "#/components/responses/ManagerError" }
  /ai/manager/api/model/list:
    get:
      operationId: listModels
      description: Returns active and historical Model rows with batched Source Config summaries.
      responses:
        "200": { $ref: "#/components/responses/ModelList" }
  /ai/manager/api/model/summary/list:
    get:
      operationId: listModelSummaries
      description: Returns Model summary rows with batched Source Config summaries.
      responses:
        "200": { $ref: "#/components/responses/ModelSummaryList" }
  /ai/manager/api/model/{id}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    put:
      operationId: updateModel
      description: Updates only Model core fields. Source Config is changed through its dedicated complete-replacement endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelUpdate" }
      responses:
        "200": { $ref: "#/components/responses/ModelCore" }
        "422": { $ref: "#/components/responses/ManagerError" }
    delete:
      operationId: deleteModel
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /ai/manager/api/model/{id}/detail:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getModelDetail
      responses:
        "200": { $ref: "#/components/responses/ModelDetail" }
  /ai/manager/api/model/{id}/source-config:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getModelSourceConfig
      responses:
        "200": { $ref: "#/components/responses/ModelSourceConfig" }
    put:
      operationId: replaceModelSourceConfig
      description: Atomically replaces the complete Model Source Config. INHERIT_ALL requires an empty bindings array; EXPLICIT may be empty and may contain at most one default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelSourceConfig" }
      responses:
        "200": { $ref: "#/components/responses/ModelSourceConfig" }
        "422": { $ref: "#/components/responses/ManagerError" }
  /ai/manager/api/model/{id}/source-config/explain:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: explainModelSourceConfig
      description: Explains deterministic Source selection for OpenAI, Responses, Anthropic, and Gemini without selecting credentials or making an upstream call.
      responses:
        "200": { $ref: "#/components/responses/ModelSourceExplain" }
        "422": { $ref: "#/components/responses/ManagerError" }
  /ai/manager/api/provider:
    post:
      operationId: createProvider
      description: Creates one Logical Provider. The optional initial_source creates one explicit Source in the same transaction; a Provider may legitimately have zero Sources. Legacy top-level endpoint, provider_type, and use_proxy fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderUpsert" }
      responses:
        "200": { $ref: "#/components/responses/ProviderAggregate" }
        "422": { $ref: "#/components/responses/ManagerError" }
  /ai/manager/api/provider/list:
    get:
      operationId: listProviders
      responses:
        "200": { $ref: "#/components/responses/ProviderAggregateList" }
  /ai/manager/api/provider/summary/list:
    get:
      operationId: listProviderSummaries
      responses:
        "200": { $ref: "#/components/responses/ProviderSummaryList" }
  /ai/manager/api/provider/bootstrap:
    post:
      operationId: bootstrapProvider
      description: Atomically creates the Logical Provider, its required enabled default initial Source, one Provider credential, and one model. The credential is an opaque Provider-owned string interpreted by the selected Source Profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderBootstrap" }
      responses:
        "200": { $ref: "#/components/responses/ProviderBootstrap" }
        "422": { $ref: "#/components/responses/ManagerError" }
  /ai/manager/api/provider/{id}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: getProvider
      responses:
        "200": { $ref: "#/components/responses/ProviderAggregate" }
    put:
      operationId: updateProvider
      description: Updates only Logical Provider fields. It never creates, deletes, enables, selects, or changes the Profile of a Source.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderUpdate" }
      responses:
        "200": { $ref: "#/components/responses/ProviderAggregate" }
        "422": { $ref: "#/components/responses/ManagerError" }
    delete:
      operationId: deleteProvider
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /ai/manager/api/provider/{id}/detail:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: getProviderDetail
      description: Returns the Provider aggregate with its active Models, Provider credential summaries, and request patch summaries.
      responses:
        "200": { $ref: "#/components/responses/ProviderDetail" }
  /ai/manager/api/provider/detail/list:
    get:
      operationId: listProviderDetails
      description: Returns the aggregate detail rows used by management selectors and Record Source flattening.
      responses:
        "200": { $ref: "#/components/responses/ProviderDetailList" }
  /ai/manager/api/provider/{id}/sources:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    post:
      operationId: createProviderSource
      description: Creates a Source with an immutable Profile. Source identity is source_id; no legacy key or implicit default alias is exposed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamSourceInput" }
      responses:
        "200": { $ref: "#/components/responses/UpstreamSource" }
        "422": { $ref: "#/components/responses/ManagerError" }
  /ai/manager/api/provider/{id}/sources/{source_id}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
      - $ref: "#/components/parameters/SourceId"
    put:
      operationId: updateProviderSource
      description: Updates Source endpoint, proxy, enabled, and default target state. Profile is immutable and cannot be supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamSourceUpdate" }
      responses:
        "200": { $ref: "#/components/responses/UpstreamSource" }
        "422": { $ref: "#/components/responses/ManagerError" }
    delete:
      operationId: deleteProviderSource
      description: Soft-deletes the addressed Source, including the final or default Source; no replacement is required.
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /ai/manager/api/provider/{id}/sources/{source_id}/model-impact:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: previewProviderSourceModelImpact
      description: Previews bounded Model Source selection impact for a Source mutation. This endpoint has no side effects and never returns Model IDs or request payloads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceImpactRequest" }
      responses:
        "200": { $ref: "#/components/responses/SourceImpact" }
        "422": { $ref: "#/components/responses/ManagerError" }
  /ai/manager/api/provider/{id}/sources/{source_id}/check:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: checkProviderSource
      description: Checks the explicitly addressed Source with an explicitly selected saved Provider credential or draft opaque credential and Model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCheck" }
      responses:
        "200": { $ref: "#/components/responses/SourceEvidence" }
        "422": { $ref: "#/components/responses/ManagerError" }
  /ai/manager/api/provider/{id}/provider_keys:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: listProviderKeys
      x-cyder-error-codes: [1002, 1100]
      responses:
        "200":
          $ref: "#/components/responses/ProviderKeyList"
    post:
      operationId: createProviderKey
      description: Encrypts a new credential. The plaintext is never returned. This operation does not accept or require TOTP reauthentication.
      x-cyder-error-codes: [1001, 1002, 1100, 1101, 1201]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKeyCreate"
      responses:
        "200":
          $ref: "#/components/responses/ProviderKeySummary"
        "503":
          $ref: "#/components/responses/RuntimeRefreshFailed"
  /ai/manager/api/provider/{id}/provider_keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
      - $ref: "#/components/parameters/ProviderKeyId"
    get:
      operationId: getProviderKey
      x-cyder-error-codes: [1002, 1100]
      responses:
        "200":
          $ref: "#/components/responses/ProviderKeySummary"
    put:
      operationId: updateProviderKeyMetadata
      description: Updates only description and enabled state; it never accepts a credential or TOTP reauthentication.
      x-cyder-error-codes: [1001, 1002, 1100, 1201]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKeyMetadataUpdate"
      responses:
        "200":
          $ref: "#/components/responses/ProviderKeySummary"
        "503":
          $ref: "#/components/responses/RuntimeRefreshFailed"
    delete:
      operationId: deleteProviderKey
      description: Soft-deletes the key and irreversibly clears its encrypted secret material. This operation does not accept or require TOTP reauthentication.
      x-cyder-error-codes: [1002, 1100, 1201]
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "503":
          $ref: "#/components/responses/RuntimeRefreshFailed"
  /ai/manager/api/provider/{id}/provider_keys/{key_id}/replace:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
      - $ref: "#/components/parameters/ProviderKeyId"
    post:
      operationId: replaceProviderKeySecret
      description: Replaces the credential while preserving key identity, metadata, and enabled state. It does not accept or require TOTP reauthentication. Do not replay automatically.
      x-cyder-error-codes: [1001, 1002, 1100, 1101, 1201]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKeyReplace"
      responses:
        "200":
          $ref: "#/components/responses/ProviderKeySummary"
        "503":
          $ref: "#/components/responses/RuntimeRefreshFailed"
  /ai/manager/api/provider/{id}/provider_keys/{key_id}/reveal:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
      - $ref: "#/components/parameters/ProviderKeyId"
    post:
      operationId: revealProviderKeySecret
      description: Returns the plaintext credential under the current manager session after a secret_governance reauthentication grant has been established. This request has no body.
      x-cyder-error-codes: [1002, 1005, 1100, 1479, 1480, 1491]
      responses:
        "200":
          $ref: "#/components/responses/ProviderKeyReveal"
        "401":
          $ref: "#/components/responses/ManagerError"
        "409":
          $ref: "#/components/responses/ProviderRevealConflict"
        "422":
          $ref: "#/components/responses/ManagerError"
        "403":
          $ref: "#/components/responses/ManagerError"
        "503":
          $ref: "#/components/responses/ManagerError"
components:
  securitySchemes:
    managerAccessToken:
      type: http
      scheme: bearer
  parameters:
    ProviderId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProviderKeyId:
      name: key_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SourceId:
      name: source_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ModelId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  headers:
    NoStore:
      required: true
      schema: { type: string, const: no-store }
  schemas:
    UpstreamProfileType:
      type: string
      enum: [OPENAI, GEMINI, VERTEX, VERTEX_OPENAI, OLLAMA, ANTHROPIC, RESPONSES, GEMINI_OPENAI]
    UpstreamSourceInput:
      type: object
      additionalProperties: false
      required: [profile_type, endpoint]
      properties:
        profile_type: { $ref: "#/components/schemas/UpstreamProfileType" }
        endpoint: { type: string, format: uri, minLength: 1 }
        use_proxy: { type: boolean, default: false }
        is_enabled: { type: boolean, default: true }
        is_default: { type: boolean, default: false }
    UpstreamSourceUpdate:
      type: object
      additionalProperties: false
      properties:
        endpoint: { type: [string, "null"], format: uri, minLength: 1 }
        use_proxy: { type: [boolean, "null"] }
        is_enabled: { type: [boolean, "null"] }
        is_default: { type: [boolean, "null"] }
    UpstreamSource:
      type: object
      additionalProperties: false
      required: [id, provider_id, profile_type, endpoint, use_proxy, is_enabled, is_default, deleted_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        profile_type: { $ref: "#/components/schemas/UpstreamProfileType" }
        endpoint: { type: string, format: uri }
        use_proxy: { type: boolean }
        is_enabled: { type: boolean }
        is_default: { type: boolean }
        deleted_at: { type: [integer, "null"], format: int64 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    ProviderAggregate:
      type: object
      additionalProperties: false
      required: [id, provider_key, name, is_enabled, deleted_at, created_at, updated_at, provider_api_key_mode, upstream_sources]
      properties:
        id: { type: integer, format: int64 }
        provider_key: { type: string }
        name: { type: string }
        is_enabled: { type: boolean }
        deleted_at: { type: [integer, "null"], format: int64 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        provider_api_key_mode: { type: string, enum: [QUEUE, RANDOM] }
        upstream_sources:
          type: array
          items: { $ref: "#/components/schemas/UpstreamSource" }
    ProviderSummary:
      type: object
      additionalProperties: false
      required: [id, provider_key, name, is_enabled, source_count, enabled_source_count, default_source_id, default_source_profile_type]
      properties:
        id: { type: integer, format: int64 }
        provider_key: { type: string }
        name: { type: string }
        is_enabled: { type: boolean }
        source_count: { type: integer, format: int64, minimum: 0 }
        enabled_source_count: { type: integer, format: int64, minimum: 0 }
        default_source_id: { type: [integer, "null"], format: int64 }
        default_source_profile_type:
          anyOf:
            - $ref: "#/components/schemas/UpstreamProfileType"
            - type: "null"
    ProviderUpsert:
      type: object
      additionalProperties: false
      required: [name, key]
      properties:
        name: { type: string, minLength: 1 }
        key: { type: string, minLength: 1 }
        initial_source: { $ref: "#/components/schemas/UpstreamSourceInput" }
        provider_api_key_mode: { type: [string, "null"], enum: [QUEUE, RANDOM, null] }
        is_enabled: { type: [boolean, "null"] }
    ProviderUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        is_enabled: { type: [boolean, "null"] }
        provider_api_key_mode: { type: [string, "null"], enum: [QUEUE, RANDOM, null] }
    ProviderBootstrap:
      type: object
      additionalProperties: false
      required: [initial_source, api_key, model_name, key]
      properties:
        initial_source: { $ref: "#/components/schemas/UpstreamSourceInput" }
        api_key: { type: string, minLength: 1 }
        model_name: { type: string, minLength: 1 }
        name: { type: [string, "null"] }
        key: { type: string, minLength: 1 }
        real_model_name: { type: [string, "null"] }
        save_and_test: { type: boolean, default: false }
        api_key_description: { type: [string, "null"] }
    ProviderCheck:
      type: object
      additionalProperties: false
      properties:
        model_id: { type: [integer, "null"], format: int64 }
        model_name: { type: [string, "null"] }
        provider_api_key_id: { type: [integer, "null"], format: int64 }
        provider_api_key: { type: [string, "null"] }
    SourceEvidence:
      type: object
      additionalProperties: false
      required: [source_id, profile_type]
      properties:
        source_id: { type: integer, format: int64 }
        profile_type: { $ref: "#/components/schemas/UpstreamProfileType" }
    DownstreamProtocol:
      type: string
      enum: [OPENAI, RESPONSES, ANTHROPIC, GEMINI]
    UpstreamProtocol:
      type: string
      enum: [OPENAI, RESPONSES, ANTHROPIC, GEMINI, OLLAMA]
    ModelSourceSelectionMode:
      type: string
      enum: [INHERIT_ALL, EXPLICIT]
    ModelSourceBinding:
      type: object
      additionalProperties: false
      required: [source_id]
      properties:
        source_id: { type: integer, format: int64, minimum: 1 }
        is_default: { type: boolean, default: false }
    ModelSourceBindingSummary:
      type: object
      additionalProperties: false
      required: [source_id, is_default, profile_type, is_enabled]
      properties:
        source_id: { type: integer, format: int64 }
        is_default: { type: boolean }
        profile_type: { $ref: "#/components/schemas/UpstreamProfileType" }
        is_enabled: { type: boolean }
    ModelSourceConfig:
      type: object
      additionalProperties: false
      required: [source_selection_mode, bindings]
      properties:
        source_selection_mode: { $ref: "#/components/schemas/ModelSourceSelectionMode" }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/ModelSourceBinding" }
    ModelSourceConfigSummary:
      type: object
      additionalProperties: false
      required: [source_selection_mode, bindings, declared_source_count, enabled_source_count, model_default_source_id, warnings]
      properties:
        source_selection_mode: { $ref: "#/components/schemas/ModelSourceSelectionMode" }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/ModelSourceBindingSummary" }
        declared_source_count: { type: integer, minimum: 0 }
        enabled_source_count: { type: integer, minimum: 0 }
        model_default_source_id: { type: [integer, "null"], format: int64 }
        warnings:
          type: array
          items: { type: string }
    SourceSelectionTraceEntry:
      type: object
      additionalProperties: false
      required: [key, source_ids]
      properties:
        key: { type: string }
        source_ids:
          type: array
          items: { type: integer, format: int64 }
    ModelSourceProtocolExplain:
      type: object
      additionalProperties: false
      required: [downstream_protocol, selection_status, source_id, profile_type, upstream_protocol, selection_reason, transform_required, decision_trace, failure_reason, generation_execution_status, generation_execution_reason]
      properties:
        downstream_protocol: { $ref: "#/components/schemas/DownstreamProtocol" }
        selection_status: { type: string, enum: [selected, unselectable] }
        source_id: { type: [integer, "null"], format: int64 }
        profile_type:
          anyOf:
            - $ref: "#/components/schemas/UpstreamProfileType"
            - type: "null"
        upstream_protocol:
          anyOf:
            - $ref: "#/components/schemas/UpstreamProtocol"
            - type: "null"
        selection_reason:
          type: [string, "null"]
          enum: [protocol_match, provider_default_transform, model_default_transform, null]
        transform_required: { type: [boolean, "null"] }
        decision_trace:
          type: array
          items: { $ref: "#/components/schemas/SourceSelectionTraceEntry" }
        failure_reason: { type: [string, "null"] }
        generation_execution_status: { type: string }
        generation_execution_reason: { type: string }
    ModelSourceExplain:
      type: object
      additionalProperties: false
      required: [model_id, provider_id, source_selection_mode, provider_enabled, model_enabled, declared_source_count, enabled_source_count, model_default_source_id, warnings, protocols]
      properties:
        model_id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        source_selection_mode: { $ref: "#/components/schemas/ModelSourceSelectionMode" }
        provider_enabled: { type: boolean }
        model_enabled: { type: boolean }
        declared_source_count: { type: integer, minimum: 0 }
        enabled_source_count: { type: integer, minimum: 0 }
        model_default_source_id: { type: [integer, "null"], format: int64 }
        warnings:
          type: array
          items: { type: string }
        protocols:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/ModelSourceProtocolExplain" }
    ModelCreate:
      type: object
      additionalProperties: false
      required: [provider_id, model_name]
      properties:
        provider_id: { type: integer, format: int64 }
        model_name: { type: string, minLength: 1 }
        real_model_name: { type: [string, "null"] }
        is_enabled: { type: boolean, default: true }
        source_config: { $ref: "#/components/schemas/ModelSourceConfig" }
    ModelUpdate:
      type: object
      additionalProperties: false
      required: [model_name, is_enabled, cost_catalog_id]
      properties:
        model_name: { type: string, minLength: 1 }
        real_model_name: { type: [string, "null"] }
        is_enabled: { type: boolean }
        cost_catalog_id: { type: [integer, "null"], format: int64 }
    Model:
      type: object
      additionalProperties: false
      required: [id, provider_id, model_name, real_model_name, cost_catalog_id, source_selection_mode, deleted_at, is_enabled, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        model_name: { type: string }
        real_model_name: { type: [string, "null"] }
        cost_catalog_id: { type: [integer, "null"], format: int64 }
        source_selection_mode: { $ref: "#/components/schemas/ModelSourceSelectionMode" }
        deleted_at: { type: [integer, "null"], format: int64 }
        is_enabled: { type: boolean }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    ModelResponse:
      type: object
      additionalProperties: false
      required: [id, provider_id, model_name, real_model_name, cost_catalog_id, source_selection_mode, deleted_at, is_enabled, created_at, updated_at, source_config]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        model_name: { type: string }
        real_model_name: { type: [string, "null"] }
        cost_catalog_id: { type: [integer, "null"], format: int64 }
        source_selection_mode: { $ref: "#/components/schemas/ModelSourceSelectionMode" }
        deleted_at: { type: [integer, "null"], format: int64 }
        is_enabled: { type: boolean }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        source_config: { $ref: "#/components/schemas/ModelSourceConfigSummary" }
    ModelSummary:
      type: object
      additionalProperties: false
      required: [id, provider_id, provider_key, provider_name, model_name, real_model_name, source_selection_mode, is_enabled, source_config]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_key: { type: string }
        provider_name: { type: string }
        model_name: { type: string }
        real_model_name: { type: [string, "null"] }
        source_selection_mode: { $ref: "#/components/schemas/ModelSourceSelectionMode" }
        is_enabled: { type: boolean }
        source_config: { $ref: "#/components/schemas/ModelSourceConfigSummary" }
    ModelDetail:
      type: object
      additionalProperties: false
      required: [model, request_patches, inherited_request_patches, effective_request_patches, request_patch_explain, request_patch_conflicts, has_request_patch_conflicts, source_config]
      properties:
        model: { $ref: "#/components/schemas/Model" }
        request_patches:
          type: array
          items: { type: object }
        inherited_request_patches:
          type: array
          items: { type: object }
        effective_request_patches:
          type: array
          items: { type: object }
        request_patch_explain:
          type: array
          items: { type: object }
        request_patch_conflicts:
          type: array
          items: { type: object }
        has_request_patch_conflicts: { type: boolean }
        source_config: { $ref: "#/components/schemas/ModelSourceConfigSummary" }
    ProviderModelDetail:
      allOf:
        - $ref: "#/components/schemas/ModelDetail"
    SourceImpactAction:
      type: string
      enum: [DISABLE, DELETE, SET_DEFAULT, UNSET_DEFAULT]
    SourceImpactRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/SourceImpactAction" }
    SourceImpactProtocolSummary:
      type: object
      additionalProperties: false
      required: [downstream_protocol, selection_changed_count, would_become_unselectable_count]
      properties:
        downstream_protocol: { $ref: "#/components/schemas/DownstreamProtocol" }
        selection_changed_count: { type: integer, minimum: 0 }
        would_become_unselectable_count: { type: integer, minimum: 0 }
    SourceImpactReport:
      type: object
      additionalProperties: false
      required: [action, provider_id, source_id, inherit_all_model_count, explicit_binding_model_count, explicit_default_model_count, protocols]
      properties:
        action: { $ref: "#/components/schemas/SourceImpactAction" }
        provider_id: { type: integer, format: int64 }
        source_id: { type: integer, format: int64 }
        inherit_all_model_count: { type: integer, minimum: 0 }
        explicit_binding_model_count: { type: integer, minimum: 0 }
        explicit_default_model_count: { type: integer, minimum: 0 }
        protocols:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/SourceImpactProtocolSummary" }
    BootstrapCheckResult:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    ProviderBootstrapResult:
      type: object
      additionalProperties: false
      required: [provider, created_key, created_model, provider_name, provider_key, check_result]
      properties:
        provider: { $ref: "#/components/schemas/ProviderAggregate" }
        created_key: { $ref: "#/components/schemas/ProviderKeySummary" }
        created_model: { $ref: "#/components/schemas/Model" }
        provider_name: { type: string }
        provider_key: { type: string }
        check_result:
          anyOf:
            - $ref: "#/components/schemas/BootstrapCheckResult"
            - type: "null"
    ProviderKeyCreate:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
    ProviderKeyReplace:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: { type: string, minLength: 1 }
    ProviderKeyMetadataUpdate:
      type: object
      additionalProperties: false
      required: [description, is_enabled]
      properties:
        description: { type: [string, "null"] }
        is_enabled: { type: boolean }
    ProviderKeySummary:
      type: object
      additionalProperties: false
      required: [id, provider_id, description, key_prefix, key_last4, is_enabled, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        description: { type: [string, "null"] }
        key_prefix: { type: string }
        key_last4: { type: string }
        is_enabled: { type: boolean }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    ProviderKeyReveal:
      allOf:
        - $ref: "#/components/schemas/ProviderKeySummary"
        - type: object
          required: [api_key]
          properties:
            api_key: { type: string }
    ModelEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ModelResponse" }
    ModelListEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data:
          type: array
          items: { $ref: "#/components/schemas/ModelResponse" }
    ModelSummaryListEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data:
          type: array
          items: { $ref: "#/components/schemas/ModelSummary" }
    ModelCoreEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/Model" }
    ModelDetailEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ModelDetail" }
    ModelSourceConfigEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ModelSourceConfigSummary" }
    ModelSourceExplainEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ModelSourceExplain" }
    SourceImpactEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/SourceImpactReport" }
    ProviderAggregateEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ProviderAggregate" }
    ProviderAggregateListEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data:
          type: array
          items: { $ref: "#/components/schemas/ProviderAggregate" }
    ProviderDetail:
      type: object
      additionalProperties: false
      required: [provider, models, provider_keys, request_patches]
      properties:
        provider: { $ref: "#/components/schemas/ProviderAggregate" }
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModelDetail" }
        provider_keys:
          type: array
          items: { $ref: "#/components/schemas/ProviderKeySummary" }
        request_patches:
          type: array
          items: { type: object }
    ProviderDetailEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ProviderDetail" }
    ProviderDetailListEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data:
          type: array
          items: { $ref: "#/components/schemas/ProviderDetail" }
    ProviderSummaryListEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data:
          type: array
          items: { $ref: "#/components/schemas/ProviderSummary" }
    ProviderBootstrapEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ProviderBootstrapResult" }
    UpstreamSourceEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/UpstreamSource" }
    SourceEvidenceEnvelope:
      type: object
      additionalProperties: false
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/SourceEvidence" }
    ProviderKeySummaryEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ProviderKeySummary" }
    ProviderKeyListEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data:
          type: array
          items: { $ref: "#/components/schemas/ProviderKeySummary" }
    ProviderKeyRevealEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/ProviderKeyReveal" }
    EmptyEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { type: "null" }
    Error:
      type: object
      required: [code, msg]
      properties:
        code: { type: integer }
        msg: { type: string }
  responses:
    Model:
      description: Model core and batched Source Config summary.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ModelEnvelope" }
    ModelList:
      description: Model rows with batched Source Config summaries.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ModelListEnvelope" }
    ModelSummaryList:
      description: Model summary rows with batched Source Config summaries.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ModelSummaryListEnvelope" }
    ModelCore:
      description: Updated Model core without Source Config mutation.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ModelCoreEnvelope" }
    ModelDetail:
      description: Model detail with request patch diagnostics and Source Config summary.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ModelDetailEnvelope" }
    ModelSourceConfig:
      description: Complete visible Model Source Config summary; deleted Sources are omitted.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ModelSourceConfigEnvelope" }
    ModelSourceExplain:
      description: Deterministic four-protocol Source selection explanation with bounded trace and failure reasons.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ModelSourceExplainEnvelope" }
    SourceImpact:
      description: Bounded Source mutation impact counts by mode and downstream protocol.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SourceImpactEnvelope" }
    ProviderAggregate:
      description: Logical Provider with zero-to-many nested Upstream Sources.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderAggregateEnvelope" }
    ProviderAggregateList:
      description: Logical Providers with zero-to-many nested Upstream Sources each.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderAggregateListEnvelope" }
    ProviderSummaryList:
      description: Provider summaries with Source counts and optional default metadata.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderSummaryListEnvelope" }
    ProviderDetail:
      description: Provider aggregate detail with active Models, Provider credential summaries, and request patch summaries.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderDetailEnvelope" }
    ProviderDetailList:
      description: Provider aggregate detail list used by management and Record Source selectors.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderDetailListEnvelope" }
    ProviderBootstrap:
      description: Atomically bootstrapped Provider aggregate, Provider credential summary, model, and optional check result.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderBootstrapEnvelope" }
    SourceEvidence:
      description: Exact Source addressed by the Provider check.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SourceEvidenceEnvelope" }
    UpstreamSource:
      description: Complete active or soft-deleted Source record identified only by source_id.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpstreamSourceEnvelope" }
    ProviderKeyList:
      description: Safe provider key summaries without plaintext or encrypted secret fields.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderKeyListEnvelope" }
    ProviderKeySummary:
      description: Safe provider key summary without plaintext or encrypted secret fields.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderKeySummaryEnvelope" }
    ProviderKeyReveal:
      description: Provider credential plaintext returned only by POST Reveal.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProviderKeyRevealEnvelope" }
    Empty:
      description: Mutation completed.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EmptyEnvelope" }
    ProviderSecretUnavailable:
      description: Stored provider credential cannot be safely decrypted.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code: { const: 1005 }
    ManagerError:
      description: Stable manager command, authentication, or sensitive TOTP error.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProviderRevealConflict:
      description: Either the stored provider credential is unavailable or the current secret-governance reauthentication grant is stale or replayed.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RuntimeRefreshFailed:
      description: The database mutation committed, but the provider is fail-closed because a trustworthy runtime refresh failed. Do not replay automatically.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code: { const: 1201 }
