schema_version: 3

downstream_protocols:
  - OPENAI
  - RESPONSES
  - ANTHROPIC
  - GEMINI

upstream_protocols:
  - OPENAI
  - RESPONSES
  - ANTHROPIC
  - GEMINI
  - OLLAMA

downstream_error_contracts:
  scope:
    before_headers_committed: true
    after_headers_committed_owners: [R3.7, R3.8, R3.15-R3.21]
    ollama_downstream_contract: absent
    upstream_error_location: top_level
  router_rejections:
    - { code: route_not_found_error, http_status: 404 }
    - { code: method_not_allowed_error, http_status: 405, required_header: Allow }
  protocols:
    - downstream_protocol: OPENAI
      envelope: openai_error
      stable_code_path: error.code
      request_id_body_path: absent
      request_id_headers: [x-request-id]
      upstream_error_path: upstream_error
      evidence: [error-contract-unit, error-contract-golden, error-contract-router, response-limit-raw-four-protocol, response-limit-decoded-four-protocol, response-encoding-four-protocol, stream-resource-postcommit-four-protocol, provider-error-hard-limit-four-protocol]
    - downstream_protocol: RESPONSES
      envelope: openai_error
      stable_code_path: error.code
      request_id_body_path: absent
      request_id_headers: [x-request-id]
      upstream_error_path: upstream_error
      evidence: [error-contract-unit, error-contract-golden, error-contract-router, response-limit-raw-four-protocol, response-limit-decoded-four-protocol, response-encoding-four-protocol, stream-resource-postcommit-four-protocol, provider-error-hard-limit-four-protocol]
    - downstream_protocol: ANTHROPIC
      envelope: anthropic_error
      stable_code_path: error.code
      request_id_body_path: request_id
      request_id_headers: [x-request-id, request-id]
      upstream_error_path: upstream_error
      evidence: [error-contract-unit, error-contract-golden, error-contract-router, response-limit-raw-four-protocol, response-limit-decoded-four-protocol, response-encoding-four-protocol, stream-resource-postcommit-four-protocol, provider-error-hard-limit-four-protocol]
    - downstream_protocol: GEMINI
      envelope: google_rpc_error
      stable_code_path: error.details.google_rpc_error_info.metadata.cyder_code
      request_id_body_path: error.details.google_rpc_error_info.metadata.request_id
      request_id_headers: [x-request-id]
      upstream_error_path: upstream_error
      evidence: [error-contract-unit, error-contract-golden, error-contract-router, response-limit-raw-four-protocol, response-limit-decoded-four-protocol, response-encoding-four-protocol, stream-resource-postcommit-four-protocol, provider-error-hard-limit-four-protocol]

evidence:
  - id: error-contract-unit
    kind: test
    reference: "proxy::error::response::tests::protocol_error_contracts_cover_all_116_proxy_and_8_router_combinations"
    summary: "Exhaustively pins all 116 ProxyError and 8 Router Rejection protocol envelopes, code paths, headers, and upstream extensions."
  - id: error-contract-golden
    kind: test
    reference: "proxy::error_contract_regression::four_downstream_error_contracts_match_golden_fixtures"
    summary: "Exercises authentic Provider 429 responses through all four real downstream routers with complete protocol bodies and one upstream call."
  - id: error-contract-router
    kind: test
    reference: "proxy::error_contract_regression::router_and_ingress_rejections_use_protocol_contracts"
    summary: "Exercises four-protocol ingress, extractor, utility, 404, 405, CORS, and Ollama boundaries through the real router."
  - id: response-limit-raw-four-protocol
    kind: test
    reference: "proxy::direct_execution_regression::four_public_protocols_use_existing_envelopes_for_non_stream_response_limit"
    summary: "Exercises raw response hard-limit failures through all four real downstream routers with stable pre-commit envelopes, one request log, and one upstream call."
  - id: response-limit-decoded-four-protocol
    kind: test
    reference: "proxy::direct_execution_regression::four_public_protocols_use_existing_envelopes_for_decoded_response_limit"
    summary: "Exercises gzip decoded-body hard-limit failures through all four real downstream routers without exposing an upstream_error extension."
  - id: response-encoding-four-protocol
    kind: test
    reference: "proxy::direct_execution_regression::four_public_protocols_reject_sse_encoding_before_headers"
    summary: "Exercises unsupported SSE response encoding before header commit through all four protocol adapters, including request identity and lifecycle assertions."
  - id: stream-resource-postcommit-four-protocol
    kind: test
    reference: "proxy::direct_execution_regression::four_public_protocols_terminate_body_on_sse_parser_failure"
    summary: "Exercises post-commit SSE parser failure through all four real downstream routers, proving one Body error, no second envelope, and one terminal lifecycle."
  - id: provider-error-hard-limit-four-protocol
    kind: test
    reference: "proxy::direct_execution_regression::four_public_protocols_preserve_bounded_provider_error_when_body_reaches_hard_limit"
    summary: "Exercises bounded Provider 429 payloads at the overall response hard limit through all four protocol adapters without replacing the authentic status or extension."
  - id: direct-non-stream
    kind: test
    reference: "proxy::direct_execution_regression::direct_execution_regression_non_stream_request_response_usage_and_log_golden"
    summary: "Exercises routing, request materialization, non-stream response conversion, usage, logging, and one upstream call for the four representative cells."
  - id: direct-stream
    kind: test
    reference: "proxy::direct_execution_regression::direct_execution_regression_stream_events_usage_and_single_call_golden"
    summary: "Exercises streaming request materialization, ordered downstream events, text, usage, and one upstream call for the four representative cells."
  - id: direct-upstream-error
    kind: test
    reference: "proxy::direct_execution_regression::direct_execution_regression_upstream_429_is_authentic_logged_and_never_retried"
    summary: "Exercises authentic upstream error conversion, complete protocol bodies, safe logging, and the no-retry contract for the four representative cells."
  - id: direct-cancellation
    kind: test
    reference: "proxy::direct_execution_regression::direct_execution_regression_client_cancellation_closes_upstream_and_logs_cancelled"
    summary: "Exercises client cancellation, upstream connection closure, cancelled logging, and the no-retry contract for the four representative cells."
  - id: direct-call-count
    kind: test
    reference: "proxy::direct_execution_regression::four_public_downstream_generation_paths_call_upstream_at_most_once"
    summary: "Pins each representative public generation path to exactly one real upstream request."
  - id: r3-9-primary-source-aggregate
    kind: test
    reference: "database::provider::tests::provider_aggregate_reads_fail_closed_for_missing_or_ambiguous_source"
    summary: "Pins every readable Logical Provider to exactly one active primary Upstream Source and fails closed for zero or multiple Sources."
  - id: r3-9-source-runtime-evidence
    kind: test
    reference: "controller::provider_runtime::tests::snapshot_builds_summary_and_filtered_items_from_one_provider_set"
    summary: "Pins Provider Runtime aggregation to the selected Source identity, Profile, safe endpoint snapshot, and Source-scoped circuit health."
  - id: representative-fixture-scope
    kind: test
    reference: "proxy::direct_execution_regression::direct_execution_regression_fixtures_define_four_complete_protocols"
    summary: "Proves that the direct-execution suite contains exactly the four representative cells and no downstream Ollama fixture."
  - id: reachable-materializers-without-cell-regression
    kind: code
    reference: "server/src/proxy/runtime/materializer.rs::select_generation_prepare_kind"
    summary: "OpenAI and Gemini upstream materializers exist, but cells outside the representative suite lack complete direct-execution evidence."
  - id: native-materializer-unavailable
    kind: code
    reference: "server/src/proxy/runtime/materializer.rs::select_generation_prepare_kind"
    summary: "Responses and Anthropic upstream generation protocols are rejected before HTTP materialization."
  - id: ollama-upstream-incomplete
    kind: code
    reference: "server/src/proxy/runtime/materializer.rs::select_generation_prepare_kind"
    summary: "An Ollama /api/chat materialization path exists, but no complete direct-execution cell proves native behavior; model directories are local configured Models and are not discovered through /api/tags."
  - id: ollama-stream-incomplete
    kind: code
    reference: "server/src/proxy/runtime/transport/stream.rs"
    summary: "The transport does not provide a complete native Ollama NDJSON streaming contract."
  - id: advanced-transform-only
    kind: test
    reference: "cargo run -p cyder-api --bin transform_quality_gate -- --quick"
    summary: "Transform quality evidence exists, but it does not satisfy the router-to-upstream direct-execution bar for advanced dimensions."
  - id: router-contract
    kind: test
    reference: "proxy::router::tests::four_protocol_version_aliases_are_direct_and_equivalent"
    summary: "Pins four public protocol prefixes, direct unversioned aliases, version variants, and local model routes."
  - id: router-method-contract
    kind: test
    reference: "proxy::router::tests::route_methods_fail_with_405_before_authentication"
    summary: "Pins strict route methods before authentication or upstream work."
  - id: gemini-utility-exposure
    kind: test
    reference: "proxy::router::tests::gemini_exposes_only_count_tokens_utility_action"
    summary: "Pins countTokens as the only exposed Gemini utility action."
  - id: utility-pre-send-reject
    kind: test
    reference: "proxy::direct_execution_regression::incompatible_utility_targets_are_rejected_before_any_upstream_call"
    summary: "Proves incompatible embeddings, rerank, and countTokens targets fail before any HTTP upstream request."
  - id: r3-10-source-aggregate
    kind: test
    reference: "database::provider::tests::provider_aggregate_allows_zero_or_more_sources_and_preserves_family_identity"
    summary: "Proves Provider aggregates preserve zero, one, and multiple Source identities without a singular or primary fallback."
  - id: r3-10-source-repository
    kind: test
    reference: "database::upstream_source::tests::source_repository_enforces_lifecycle_family_and_ownership_contracts"
    summary: "Proves Source lifecycle, family uniqueness, default transitions, disabled reservation, soft-delete release, and ownership boundaries."
  - id: r3-10-source-selector
    kind: test
    reference: "proxy::direct_execution_regression::deepseek_multi_source_provider_freezes_exact_or_default_source_once_for_public_downstreams"
    summary: "Proves exact-family-before-default selection, frozen Source evidence, and one-call behavior across public downstream protocols."
  - id: r3-10-manager-source-contract
    kind: test
    reference: "controller::provider::tests::manager_provider_openapi_matches_routes_safe_dtos_and_errors"
    summary: "Pins the Manager Provider OpenAPI paths, aggregate DTOs, nested Source operations, opaque credentials, and removed legacy routes."
  - id: r3-10-runtime-source-contract
    kind: test
    reference: "controller::provider_runtime::tests::snapshot_builds_summary_and_filtered_items_from_one_provider_set"
    summary: "Pins Source-level Runtime rows, source identity/profile evidence, summary counts, and safe endpoint output."
  - id: r3-10-migration-contract
    kind: test
    reference: "database::migration_smoke_tests::sqlite_r310_source_migration_preserves_rows_and_enforces_source_contract"
    summary: "Pins the R3.9-to-R3.10 Source migration retention, ID continuity, Profile labels, and database constraint contract."
  - id: r3-11-source-selector
    kind: test
    reference: "proxy::direct_execution_regression::direct_execution_explicit_scope_is_closed_and_fail_closed"
    summary: "Pins EXPLICIT model Source scope, explicit empty failure, disabled/deleted default failure, zero upstream calls, and no Provider-default escape."
  - id: r3-11-model-source-config
    kind: test
    reference: "controller::model::tests::source_config_http_lifecycle_is_atomic_and_explain_survives_disabled_entities"
    summary: "Pins atomic Model creation with Source Config, complete replacement, summary shape, four-protocol Explain, and disabled entity diagnostics."
  - id: r3-11-source-impact-and-check
    kind: test
    reference: "controller::provider::tests::source_impact_http_preview_covers_all_actions_without_side_effects"
    summary: "Pins bounded DISABLE, DELETE, SET_DEFAULT, and UNSET_DEFAULT impact previews without mutation or Model ID disclosure."
  - id: r3-11-request-log-reason
    kind: test
    reference: "proxy::direct_execution_regression::direct_execution_model_default_selection_reason_is_persisted_after_flush"
    summary: "Pins model-default Source selection reason persistence after request-log flush while retaining one selected Source."
  - id: r3-11-model-catalog-selector
    kind: test
    reference: "proxy::models::tests::models_listing_uses_the_protocol_selector_for_source_visibility"
    summary: "Pins local model directory visibility to the shared protocol Source selector and enabled Source state."
  - id: r3-11-ollama-discovery-boundary
    kind: code
    reference: "server/src/proxy/models.rs::get_accessible_models"
    summary: "The public model directory is built from saved local Model records; no Ollama /api/tags discovery or import route is part of the R3.11 contract."
  - id: r3-12-request-patch-contract
    kind: test
    reference: "controller::request_patch::tests::request_patch_openapi_matches_aggregate_routes_and_current_detail_shapes"
    summary: "Pins Source and Model+Source aggregate Request Patch routes, current DTO shapes, old route negatives, no-store responses, and ownership errors."
  - id: r3-12-request-patch-execution
    kind: test
    reference: "proxy::direct_execution_regression::request_patch_query_value_reaches_upstream_but_not_request_log"
    summary: "Pins the Source-bound Variant through real request materialization and upstream execution while keeping patched values out of the persisted request log."
  - id: r3-12-request-patch-migration
    kind: test
    reference: "database::migration_smoke_tests::sqlite_r310_source_migration_preserves_rows_and_enforces_source_contract"
    summary: "Pins the R3.11-to-R3.12 destructive migration, historical suffix rename, preserved governance/metrics, removed configuration tables, and new Source-bound constraints."

upstream_source_contract:
  owner: R3.12
  source_cardinality: zero_to_many
  source_identity: source_id_only
  aggregate_field: upstream_sources
  source_state: explicit_enabled_and_default
  default_semantics: optional
  profile_mutability: create_only
  family_uniqueness: one_active_source_per_wire_family
  disabled_source_reserves_family: true
  deleted_source_releases_family: true
  selection_order: [protocol_match, inherit_all_provider_default_transform, explicit_model_default_transform]
  no_fallback_after_selection: true
  credential_scope: provider
  credential_representation: opaque
  model_scope: model_source_selection_mode_and_visible_bindings
  model_owner: R3.11
  request_patch_scope: source_bound_variant
  reasoning_scope: protocol_transform_only
  config_owner: R3.12
  evidence: [r3-10-source-aggregate, r3-10-source-repository, r3-10-source-selector, r3-10-manager-source-contract, r3-10-runtime-source-contract, r3-10-migration-contract, r3-11-source-selector, r3-11-model-source-config, r3-11-source-impact-and-check, r3-11-request-log-reason, r3-12-request-patch-contract, r3-12-request-patch-execution, r3-12-request-patch-migration]

upstream_source_profiles:
  - profile_type: OPENAI
    upstream_protocol: OPENAI
    dialect: standard
    auth: bearer_api_key
    endpoint: base_url
  - profile_type: GEMINI
    upstream_protocol: GEMINI
    dialect: standard
    auth: gemini_api_key
    endpoint: base_url
  - profile_type: VERTEX
    upstream_protocol: GEMINI
    dialect: standard
    auth: vertex_oauth
    endpoint: vertex_gemini
  - profile_type: VERTEX_OPENAI
    upstream_protocol: OPENAI
    dialect: gemini_openai_compatibility
    auth: vertex_oauth
    endpoint: vertex_openai
  - profile_type: OLLAMA
    upstream_protocol: OLLAMA
    dialect: standard
    auth: bearer_api_key
    endpoint: base_url
  - profile_type: ANTHROPIC
    upstream_protocol: ANTHROPIC
    dialect: standard
    auth: anthropic_api_key
    endpoint: base_url
  - profile_type: RESPONSES
    upstream_protocol: RESPONSES
    dialect: standard
    auth: bearer_api_key
    endpoint: base_url
  - profile_type: GEMINI_OPENAI
    upstream_protocol: OPENAI
    dialect: gemini_openai_compatibility
    auth: bearer_api_key
    endpoint: base_url

routes:
  - downstream_protocol: OPENAI
    public_prefix: /ai/openai
    versions: [unversioned, v1]
    unversioned_alias_target: current_v1_semantics
    endpoints:
      - { path: /chat/completions, method: POST, kind: generation }
      - { path: /embeddings, method: POST, kind: utility }
      - { path: /rerank, method: POST, kind: utility }
      - { path: /models, method: GET, kind: local }
  - downstream_protocol: RESPONSES
    public_prefix: /ai/responses
    versions: [unversioned, v1]
    unversioned_alias_target: current_v1_semantics
    endpoints:
      - { path: /responses, method: POST, kind: generation }
      - { path: /models, method: GET, kind: local }
  - downstream_protocol: ANTHROPIC
    public_prefix: /ai/anthropic
    versions: [unversioned, v1]
    unversioned_alias_target: current_v1_semantics
    endpoints:
      - { path: /messages, method: POST, kind: generation }
      - { path: /models, method: GET, kind: local }
  - downstream_protocol: GEMINI
    public_prefix: /ai/gemini
    versions: [unversioned, v1, v1beta]
    unversioned_alias_target: current_v1_semantics
    endpoints:
      - { path: "/models/{model}:generateContent", method: POST, kind: generation }
      - { path: "/models/{model}:streamGenerateContent", method: POST, kind: generation }
      - { path: "/models/{model}:countTokens", method: POST, kind: utility }
      - { path: /models, method: GET, kind: local }

generation_cells:
