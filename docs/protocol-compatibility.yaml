    reference: "proxy::direct_execution_regression::same_wire_non_stream_observation_failure_preserves_upstream_bytes"
    summary: "Pins byte-preserving same-wire response passthrough when best-effort observation degrades."
  - id: r3-15-minor-loss-runtime
    kind: test
    reference: "proxy::direct_execution_regression::cross_wire_minor_loss_succeeds_once_and_drops_only_audited_metadata"
    summary: "Pins cross-wire controlled minor loss, one upstream call, internal-only diagnostics, Request Log success, and resource release."
  - id: r3-15-four-protocol-stream-failure
    kind: test
    reference: "proxy::direct_execution_regression::four_public_protocols_emit_one_native_terminal_on_cross_wire_stream_decode_failure"
    summary: "Pins one protocol-native terminal after headers for source transform failure across all four public downstream protocols."
  - id: r3-15-target-stream-failure
    kind: test
    reference: "proxy::direct_execution_regression::cross_wire_target_stream_rejection_emits_one_native_terminal_and_releases_resources"
    summary: "Pins target transform rejection after headers to one native terminal, an error Request Log, one upstream call, and released resources."

transform_runtime_contract:
  owner: R3.15
  same_wire_behavior: byte_preserving_passthrough
  same_wire_observation_failure: observation_degraded
  cross_wire_pipeline: [source_decode, unified_ir, target_encode]
  cross_wire_failure_behavior: fail_closed
  unknown_field_policy:
    ordinary_object_fields: serde_default_silent_ignore
    unknown_tagged_semantics: pre_send_explicit_reject
    registered_conflicts: targeted_borrowed_value_check
    full_second_schema_audit: false
    strict_target_profile_exception: gemini_openai_recursive_closed_allowlist
  loss_policy:
    minor: controlled_loss_with_internal_fact
    major: explicit_reject
    deterministic_text_downgrade: fixture_backed_controlled_loss
  header_boundary:
    before_commit: downstream_native_error_envelope
    after_commit: single_downstream_native_error_terminal_or_body_error
    normal_terminal_after_failure: false
  diagnostics:
    visibility: internal_only
    max_retained_facts: 32
    overflow_accounted: true
    payload_free: true
    public_extensions: false
  persistence:
    enabled: false
    owner: R4.6
  advanced_cell_owners:
    - { upstream_protocol: OLLAMA, owner: R3.20 }
  final_matrix_owner: R3.21
  evidence: [r3-15-transform-quality-contract, r3-15-transform-payload-free-contract, r3-15-same-wire-passthrough, r3-15-minor-loss-runtime, r3-15-four-protocol-stream-failure, r3-15-target-stream-failure]

